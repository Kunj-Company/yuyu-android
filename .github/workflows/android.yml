name: Android CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Tag builds (v1.2.3) use the tag as the version name; others use 0.1.0-<run>.
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare release keystore
        # Optional: add the YUYU_KEYSTORE_BASE64, YUYU_KEYSTORE_PASSWORD,
        # YUYU_KEY_ALIAS and YUYU_KEY_PASSWORD repository secrets to sign
        # release builds. Without them, release falls back to debug signing.
        env:
          KEYSTORE_BASE64: ${{ secrets.YUYU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yuyu-release.keystore"
            echo "YUYU_KEYSTORE_PATH=$RUNNER_TEMP/yuyu-release.keystore" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the release keystore."
          else
            echo "::warning::No release keystore secret set; release builds use debug signing."
          fi

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build APKs and bundle
        env:
          YUYU_KEYSTORE_PASSWORD: ${{ secrets.YUYU_KEYSTORE_PASSWORD }}
          YUYU_KEY_ALIAS: ${{ secrets.YUYU_KEY_ALIAS }}
          YUYU_KEY_PASSWORD: ${{ secrets.YUYU_KEY_PASSWORD }}
        run: >
          ./gradlew assembleDebug assembleRelease bundleRelease
          -Pyuyu.versionCode=${{ github.run_number }}
          -Pyuyu.versionName=${{ env.VERSION_NAME }}
          --stacktrace

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/yuyu-${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/yuyu-${VERSION_NAME}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/yuyu-${VERSION_NAME}-release.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yuyu-${{ env.VERSION_NAME }}
          path: dist/
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yuyu-release.keystore"

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: yuyu-${{ github.ref_name }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
